        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>index.html</title>
        <!--Llamada al CSS-->
        <link rel="stylesheet" type="text/css" href="CSS/CSS_LGMSI.css" />
    </head>
    <body>
        <!--CABECERA-->
        <header>
            <div>
                <h1><i>SHAPESYNC</i></h1>
                <img src="https://cdn.iconscout.com/icon/premium/png-256-thumb/imc-icon-svg-download-png-3595142.png" alt="Logo Página Web" width="100" height="100" />
            </div>
            <details class="menu-horizontal">
                <summary>☰ Menú</summary>
                <nav>
                    <a href="https://img.freepik.com/vector-gratis/grupo-personal-medico-que-lleva-iconos-relacionados-salud_53876-43071.jpg?semt=ais_hybrid&amp;w=740&amp;q=80">Salud</a>
                    <a href="https://marketplace.canva.com/Yq-3U/MAG5uXYq-3U/1/tl/canva-healthy-prepared-meals-in-glass-containers-MAG5uXYq-3U.jpg">Comida</a>
                    <a href="https://img.freepik.com/vector-gratis/concepto-equipamiento-deportivo_1284-13034.jpg?semt=ais_hybrid&amp;w=740&amp;q=80">Deporte</a>
                    <a href="https://img.freepik.com/vector-gratis/diseno-fuente-momentos-divertidos-ninos-felices_1308-42471.jpg?semt=ais_hybrid&amp;w=740&amp;q=80">Social</a>
                </nav>
            </details>
        </header>
        
        <!--PRINCIPAL-->
        <main>
            <div class="secciones">
                <h2>GALERIA DEL DEPORTE </h2>
                <img class="cambio" id="principal" src="https://img.freepik.com/vector-gratis/diseno-fuente-momentos-divertidos-ninos-felices_1308-42471.jpg?semt=ais_hybrid&amp;w=740&amp;q=80" alt="Imagen Diversión" width="120" height="100" />
                <div class="contenedores">
                    <img class="cambio" id="Foto1" src="https://img.freepik.com/vector-gratis/grupo-personal-medico-que-lleva-iconos-relacionados-salud_53876-43071.jpg?semt=ais_hybrid&amp;w=740&amp;q=80" alt="Imagen Salud" height="70" width="80" />
                    <img class="cambio" id="Foto2" src="https://img.freepik.com/vector-gratis/concepto-equipamiento-deportivo_1284-13034.jpg?semt=ais_hybrid&amp;w=740&amp;q=80" alt="Imagen deporte" height="70" width="75" />
                    <img class="cambio" id="Foto3" src="https://marketplace.canva.com/Yq-3U/MAG5uXYq-3U/1/tl/canva-healthy-prepared-meals-in-glass-containers-MAG5uXYq-3U.jpg" alt="Imagen Comida" height="70" width="100" />
                </div>
            </div>

            <div class="secciones">
                <h2>CALCULADORA IMC | SHAPESYNC</h2>
                <label for="peso"><input type="text" id="peso" name="peso" placeholder="En Kg" /></label>
                <label for="altura"><input type="text" id="altura" name="altura" placeholder="En metros" /></label>
                <button id="btnCalcular">Calcular IMC</button>
                <p id="resultado"></p>
            </div>

            <div class="secciones">
                <form id="registroForm">
                    <h2>REGISTRO</h2>
                    <label for="nombre"><input type="text" id="nombre" name="nombre" placeholder="Tu nombre" /></label>
                    <label for="email"><input type="text" id="email" name="email" placeholder="Email" /></label>
                    <button type="submit">Enviar</button>
                </form>
            </div>
        </main>

        <!--PIE DE PAGINA-->
        <footer>
            <p>© 2026 Calculadora IMC - Darío Sánchez Suárez</p>
            <p>Todos los derechos reservados</p>
            <img src="https://cdn.iconscout.com/icon/premium/png-256-thumb/imc-icon-svg-download-png-3595142.png" alt="Logo Página Web" width="80" height="80" />
        </footer>
        
        <!--Llamada al Js-->
        <script src="JS/JS_LGMSI.js"></script>
